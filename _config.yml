# GitHub Pages (Jekyll) ayarı: geliştirme notları ve kaynak dosyalar sitede yayınlanmasın.
# Nokta ile başlayan klasörler (.claude, .mcp.json) Jekyll'da zaten yayınlanmaz.
exclude:
  - CLAUDE.md
  - docs/
  - README.md
# Uygulamanın web sürümü (app/): Jekyll alt çizgiyle başlayan "_expo" klasörünü normalde atlar
include:
  - _expo
